<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fun Student</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Fun Student</h1>
<div id="msg" class="error"></div>

<!-- ЛОГИН -->
<div id="loginView" class="box">
  <h3>Вход</h3>
  <input id="email" type="email" placeholder="Email" value="admin@example.com"><br>
  <input id="password" type="password" placeholder="Пароль" value="admin"><br>
  <button onclick="login()">Войти</button>
  <p><small>Тестовые: superadmin@example.com / superAdmin, admin@example.com / admin, teacher@example.com / teacher</small></p>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="appView" class="hidden">
  <p>Роли: <b id="rolesText"></b> <button class="secondary" onclick="logout()">Выйти</button></p>
  <div id="tabs">
    <button id="tabStudents" onclick="showTab('students')">Студенты</button>
    <button id="tabUsers" onclick="showTab('users')">Пользователи</button>
  </div>

  <!-- СТУДЕНТЫ -->
  <div id="studentsView">
    <h3>Студенты</h3>
    <table>
      <thead><tr><th>ID</th><th>Имя</th><th>Фамилия</th><th>Действия</th></tr></thead>
      <tbody id="studentsBody"></tbody>
    </table>
    <div id="studentInfo" class="box hidden"></div>

    <div id="studentForm" class="box hidden">
      <h4>Добавить студента (ADMIN)</h4>
      <input id="sName" placeholder="Имя">
      <input id="sSurname" placeholder="Фамилия"><br>
      <input id="sPhone" placeholder="Телефон">
      <input id="sEmail" placeholder="Email"><br>
      <button onclick="createStudent()">Сохранить</button>
    </div>
  </div>

  <!-- ПОЛЬЗОВАТЕЛИ -->
  <div id="usersView" class="hidden">
    <h3>Пользователи</h3>
    <table>
      <thead><tr><th>ID</th><th>Email</th><th>Роли</th><th>Действия</th></tr></thead>
      <tbody id="usersBody"></tbody>
    </table>

    <div class="box">
      <h4>Добавить пользователя (SUPER_ADMIN)</h4>
      <input id="uEmail" placeholder="Email">
      <input id="uPassword" type="password" placeholder="Пароль"><br>
      <label><input type="checkbox" class="uRole" value="SUPER_ADMIN">SUPER_ADMIN</label>
      <label><input type="checkbox" class="uRole" value="ADMIN">ADMIN</label>
      <label><input type="checkbox" class="uRole" value="TEACHER">TEACHER</label><br>
      <button onclick="createUser()">Создать</button>
    </div>
  </div>
</div>

<!-- ОКНО -->
<div id="modal" class="overlay hidden">
  <div class="dialog">
    <h3 id="mTitle"></h3>
    <div id="mBody"></div>
    <div class="dialog-actions">
      <button id="mCancel" class="secondary">Отмена</button>
      <button id="mOk">OK</button>
    </div>
  </div>
</div>

<script>
// Если открываешь index.html не с сервера Spring, поставь тут "http://localhost:8080"
const API = "";

let token = localStorage.getItem("token");
let roles = JSON.parse(localStorage.getItem("roles") || "[]");

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hasRole = r => roles.includes("ROLE_" + r);

function showMsg(text) { $("msg").textContent = text || ""; }

// Окно на странице. Возвращает true (OK) или false (Отмена / Esc / клик мимо)
function openModal({ title, body, okText = "OK", danger = false }) {
  return new Promise(resolve => {
    $("mTitle").textContent = title;
    $("mBody").innerHTML = body;
    $("mOk").textContent = okText;
    $("mOk").className = danger ? "danger" : "";
    $("modal").classList.remove("hidden");
    const close = result => {
      $("modal").classList.add("hidden");
      document.onkeydown = null;
      resolve(result);
    };
    $("mOk").onclick = () => close(true);
    $("mCancel").onclick = () => close(false);
    $("modal").onclick = e => { if (e.target.id === "modal") close(false); };
    document.onkeydown = e => { if (e.key === "Escape") close(false); };
    const first = $("mBody").querySelector("input");
    if (first) first.focus();
  });
}

function confirmDelete(text) {
  return openModal({ title: "Подтверждение", body: "<p>" + esc(text) + "</p>", okText: "Удалить", danger: true });
}

async function api(method, url, body) {
  showMsg("");
  const headers = { "Content-Type": "application/json" };
  if (token) headers["Authorization"] = "Bearer " + token;
  let res;
  try {
    res = await fetch(API + url, { method, headers, body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    showMsg("Не удалось подключиться к серверу");
    throw e;
  }
  if (res.status === 401 && token) { logout(); showMsg("Сессия истекла, войдите снова"); throw new Error("401"); }
  if (res.status === 403) {
    showMsg(url.includes("/auth/login") ? "Неверный email или пароль" : "Нет прав на это действие");
    throw new Error("403");
  }
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
  if (!res.ok) {
    showMsg((data && (data.message || data.error)) || ("Ошибка " + res.status));
    throw new Error("HTTP " + res.status);
  }
  return data;
}

/* ---------- AUTH ---------- */
async function login() {
  try {
    const data = await api("POST", "/api/v1/auth/login", {
      email: $("email").value, password: $("password").value
    });
    token = data.token;
    roles = data.roles;
    localStorage.setItem("token", token);
    localStorage.setItem("roles", JSON.stringify(roles));
    openApp();
  } catch (e) { if (!$("msg").textContent) showMsg("Неверный email или пароль"); }
}

function logout() {
  token = null; roles = [];
  localStorage.removeItem("token");
  localStorage.removeItem("roles");
  $("appView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
}

function openApp() {
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("rolesText").textContent = roles.map(r => r.replace("ROLE_", "")).join(", ");

  const canStudents = hasRole("ADMIN") || hasRole("TEACHER");
  const canUsers = hasRole("SUPER_ADMIN");
  $("tabs").classList.toggle("hidden", !(canStudents && canUsers));
  $("studentForm").classList.toggle("hidden", !hasRole("ADMIN"));

  showTab(canStudents ? "students" : "users");
}

function showTab(name) {
  $("studentsView").classList.toggle("hidden", name !== "students");
  $("usersView").classList.toggle("hidden", name !== "users");
  if (name === "students") loadStudents(); else loadUsers();
}

/* ---------- STUDENTS ---------- */
let studentsCache = [];

async function loadStudents() {
  $("studentInfo").classList.add("hidden");
  try {
    const data = await api("GET", "/api/v1/student");
    const admin = hasRole("ADMIN");
    studentsCache = data.response;
    $("studentsBody").innerHTML = data.response.map(s => `
      <tr>
        <td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.surname)}</td>
        <td>
          <button onclick="showStudent(${s.id})">Подробнее</button>
          ${admin ? `<button onclick="editStudent(${s.id})">Изменить</button>
                     <button class="danger" onclick="deleteStudent(${s.id})">Удалить</button>` : ""}
        </td>
      </tr>`).join("") || "<tr><td colspan='4'>Пусто</td></tr>";
  } catch (e) {}
}

async function showStudent(id) {
  try {
    const s = await api("GET", "/api/v1/student/info/" + id);
    $("studentInfo").classList.remove("hidden");
    $("studentInfo").innerHTML = `
      <b>${esc(s.name)} ${esc(s.surname)}</b> (id ${s.id})<br>
      Телефон: ${esc(s.phoneNumber) || "-"}<br>
      Email: ${esc(s.email) || "-"}`;
  } catch (e) {}
}

async function createStudent() {
  try {
    await api("POST", "/api/v1/student/save", {
      name: $("sName").value,
      surname: $("sSurname").value,
      phone_number: $("sPhone").value,
      email: $("sEmail").value
    });
    ["sName", "sSurname", "sPhone", "sEmail"].forEach(i => $(i).value = "");
    loadStudents();
  } catch (e) {}
}

async function editStudent(id) {
  try {
    const s = await api("GET", "/api/v1/student/" + id);
    const ok = await openModal({
      title: "Изменить студента: " + s.name + " " + s.surname,
      body: `<input id="mPhone" placeholder="Телефон" value="${esc(s.phoneNumber || "")}"><br>
             <input id="mEmail" placeholder="Email" value="${esc(s.email || "")}">`,
      okText: "Сохранить"
    });
    if (!ok) return;
    await api("PUT", "/api/v1/student/" + id, { phoneNumber: $("mPhone").value, email: $("mEmail").value });
    loadStudents();
  } catch (e) {}
}

async function deleteStudent(id) {
  const s = studentsCache.find(x => x.id === id);
  const name = s ? s.name + " " + s.surname : "с ID " + id;
  if (!(await confirmDelete("Удалить студента " + name + "?"))) return;
  try { await api("DELETE", "/api/v1/student/" + id); loadStudents(); } catch (e) {}
}

/* ---------- USERS ---------- */
let usersCache = [];

async function loadUsers() {
  try {
    const data = await api("GET", "/api/v1/users");
    usersCache = data.responses;
    $("usersBody").innerHTML = usersCache.map(u => `
      <tr>
        <td>${u.id}</td><td>${esc(u.email)}</td><td>${esc(u.roles.join(", "))}</td>
        <td>
          <button onclick="editUser(${u.id})">Роли</button>
          <button class="danger" onclick="deleteUser(${u.id})">Удалить</button>
        </td>
      </tr>`).join("") || "<tr><td colspan='4'>Пусто</td></tr>";
  } catch (e) {}
}

function selectedRoles() {
  return [...document.querySelectorAll(".uRole:checked")].map(c => c.value);
}

async function createUser() {
  try {
    await api("POST", "/api/v1/users/save", {
      email: $("uEmail").value,
      password: $("uPassword").value,
      roles: selectedRoles()
    });
    $("uEmail").value = ""; $("uPassword").value = "";
    document.querySelectorAll(".uRole").forEach(c => c.checked = false);
    loadUsers();
  } catch (e) {}
}

async function editUser(id) {
  const u = usersCache.find(x => x.id === id);
  const boxes = ["SUPER_ADMIN", "ADMIN", "TEACHER"].map(r =>
    `<label><input type="checkbox" class="mRole" value="${r}" ${u.roles.includes(r) ? "checked" : ""}>${r}</label>`
  ).join("<br>");
  const ok = await openModal({
    title: "Роли пользователя " + u.email,
    body: boxes,
    okText: "Сохранить"
  });
  if (!ok) return;
  const newRoles = [...document.querySelectorAll(".mRole:checked")].map(c => c.value);
  try {
    await api("PUT", "/api/v1/users/" + id, { email: u.email, roles: newRoles });
    loadUsers();
  } catch (e) {}
}

async function deleteUser(id) {
  const u = usersCache.find(x => x.id === id);
  if (!(await confirmDelete("Удалить пользователя " + (u ? u.email : id) + "?"))) return;
  try { await api("DELETE", "/api/v1/users/" + id); loadUsers(); } catch (e) {}
}

/* ---------- START ---------- */
if (token) openApp();
</script>
</body>
</html>
